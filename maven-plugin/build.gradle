dependencies {
    implementation project(':core')
    compileOnly 'org.apache.maven:maven-plugin-api:3.9.6'
    compileOnly 'org.apache.maven.plugin-tools:maven-plugin-annotations:3.11.0'
}

processResources {
    filesMatching('META-INF/maven/plugin.xml') {
        expand(projectVersion: project.version)
    }
}

tasks.named('jar', Jar) {
    from(project(':core').sourceSets.main.output) // Create a fat jar including the core module (We can do this without using the shadow plugin since Core isn't that big)
}

publishing {
    publications {
        gpr(MavenPublication) {
            artifactId = 'glsl-obfuscator-maven-plugin'
            from components.java
        }
    }
}