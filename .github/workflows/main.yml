name: Release and Publish

on:
  push:
    tags:
      - 'v*' # Triggers when receiving a tag push such as v1.0.1

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write # Required for NuGet Trusted Publishing (OIDC)

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          server-id: github # Maven authentication

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Run Tests (JUnit)
        run: ./gradlew test

      - name: Run Tests (.NET)
        run: dotnet test dotnet/GlslObfuscator.Tests/GlslObfuscator.Tests.csproj --configuration Release

      - name: Build JARs
        run: ./gradlew assemble sourcesJar -PreleaseVersion=${GITHUB_REF_NAME#v}

      - name: Pack NuGet package
        run: |
          mkdir -p release-artifacts
          dotnet pack dotnet/GlslObfuscator/GlslObfuscator.csproj \
            --configuration Release \
            --output release-artifacts \
            -p:PackageVersion="${GITHUB_REF_NAME#v}"

      - name: Publish NuGet package
        run: |
          dotnet nuget push "release-artifacts/Niwer.GlslObfuscator.${GITHUB_REF_NAME#v}.nupkg" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate \
            --interactive

      - name: Prepare Fixed Name JARs
        run: |
          mkdir -p release-artifacts

          # Copy the JARs of the core library
          cp $(ls core/build/libs/*.jar | grep -v -- '-sources\.jar$' | head -n 1) release-artifacts/glsl-obfuscator-core.jar
          cp core/build/libs/*-sources.jar release-artifacts/glsl-obfuscator-core-sources.jar

          # Copy the JARs of the Gradle plugin
          cp $(ls gradle-plugin/build/